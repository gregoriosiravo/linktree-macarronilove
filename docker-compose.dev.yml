services:
  macarroni-love:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
      - "4001:4001"
    environment:
      NODE_ENV: development
      NUXT_PUBLIC_SITE_URL: http://localhost:3000
      TINA_PUBLIC_IS_LOCAL: "true"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    restart: unless-stopped

volumes:
  node_modules:
